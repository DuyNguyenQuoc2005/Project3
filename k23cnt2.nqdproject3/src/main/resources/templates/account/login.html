<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="nqd-account-page">
    <section class="nqd-account-box">
        <h1 class="nqd-account-title">Đăng nhập</h1>

        <form th:action="@{/account/login}"
              method="post"
              th:object="${loginForm}"
              class="nqd-account-form">

            <div class="nqd-form-group">
                <label for="username">Tên đăng nhập</label>
                <input id="username" type="text" th:field="*{username}">
                <div class="nqd-error" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="nqd-form-group">
                <label for="password">Mật khẩu</label>
                <input id="password" type="password" th:field="*{password}">
                <div class="nqd-error" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <div class="nqd-error" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="e : ${#fields.globalErrors()}"
                th:text="${e}">Lỗi</span>
            </div>


            <button type="submit" class="nqd-btn nqd-btn-primary">
                Đăng nhập
            </button>

            <p class="nqd-account-switch">
                Chưa có tài khoản?
                <a th:href="@{/account/register}">Đăng ký ngay</a>
            </p>
        </form>
    </section>
</main>

<div th:replace="~{layout/footer :: nqdFooterFragment}"></div>
<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
