<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="nqd-account-page">
    <section class="nqd-account-box">
        <h1 class="nqd-account-title">Đăng ký tài khoản</h1>

        <form th:action="@{/account/register}"
              method="post"
              th:object="${registerForm}"
              class="nqd-account-form">

            <div class="nqd-form-group">
                <label for="username">Tên đăng nhập *</label>
                <input id="username" type="text" th:field="*{username}">
                <div class="nqd-error" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="nqd-form-group">
                <label for="password">Mật khẩu *</label>
                <input id="password" type="password" th:field="*{password}">
                <div class="nqd-error" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <div class="nqd-form-group">
                <label for="confirmPassword">Nhập lại mật khẩu *</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}">
                <div class="nqd-error" th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}"></div>
            </div>

            <div class="nqd-form-group">
                <label for="fullName">Họ và tên</label>
                <input id="fullName" type="text" th:field="*{fullName}">
            </div>

            <div class="nqd-form-group">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
            </div>

            <div class="nqd-form-group">
                <label for="phone">Số điện thoại</label>
                <input id="phone" type="text" th:field="*{phone}">
            </div>

            <div class="nqd-form-group">
                <label for="address">Địa chỉ</label>
                <textarea id="address" rows="2" th:field="*{address}"></textarea>
            </div>

            <div class="nqd-error" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="e : ${#fields.globalErrors()}"
                      th:text="${e.defaultMessage}">Lỗi</span>
            </div>

            <button type="submit" class="nqd-btn nqd-btn-primary">
                Đăng ký
            </button>

            <p class="nqd-account-switch">
                Đã có tài khoản?
                <a th:href="@{/account/login}">Đăng nhập</a>
            </p>
        </form>
    </section>
</main>

<div th:replace="~{layout/footer :: nqdFooterFragment}"></div>
<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
