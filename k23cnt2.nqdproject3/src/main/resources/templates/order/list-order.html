<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng của bạn</title>

    <!-- CSS dùng chung -->
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

    <!-- CSS riêng đơn hàng -->
    <link rel="stylesheet" th:href="@{/css/order-list.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<main class="nqd-order-page">

    <!-- BREADCRUMB (nếu muốn đồng bộ với giỏ hàng) -->
<!--    <section class="nqd-breadcrumb">-->
<!--        <div class="nqd-container nqd-breadcrumb-inner">-->
<!--            <a th:href="@{/}">Trang chủ</a>-->
<!--            <span>/</span>-->
<!--            <span>Đơn hàng</span>-->
<!--        </div>-->
<!--    </section>-->

    <section class="nqd-order-main">
        <div class="nqd-container">

            <h1 class="nqd-order-title">Đơn hàng của bạn</h1>

            <!-- THÔNG BÁO CẦN ĐĂNG NHẬP -->
            <p class="nqd-order-notice"
               th:if="${needLogin}">
                Bạn cần
                <a th:href="@{/account/login}">đăng nhập</a>
                để xem lịch sử đơn hàng của mình.
            </p>

            <!-- CHỈ HIỂN THỊ DANH SÁCH KHI ĐÃ ĐĂNG NHẬP -->
            <div th:if="${!needLogin}">

                <!-- Không có đơn -->
                <p class="nqd-order-empty"
                   th:if="${#lists.isEmpty(orders)}">
                    Bạn chưa có đơn hàng nào.
                </p>

                <!-- Có đơn -->
                <div class="nqd-order-table-wrapper"
                     th:if="${!#lists.isEmpty(orders)}">
                    <table class="nqd-order-table">
                        <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Người nhận</th>
                            <th>SĐT</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${orders}">
                            <td th:text="${o.id}">1</td>
                            <td th:text="${o.fullName}">Nguyễn Văn A</td>
                            <td th:text="${o.phone}">0123456789</td>
                            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}">
                                10/12/2025 10:00
                            </td>
                            <td th:text="${#numbers.formatDecimal(o.totalAmount,0,'POINT',0,'POINT')} + ' đ'">
                                150.000 đ
                            </td>
                            <td>
                                <!-- Badge trạng thái cho đẹp -->
                                <span class="nqd-status-badge"
                                      th:classappend="' nqd-status-' + ${o.status?.toLowerCase()}">
                                    <span th:text="${o.status}">PENDING</span>
                                </span>
                            </td>
                            <td>
                                <a th:href="@{'/order/' + ${o.id}}"
                                   class="nqd-order-link">
                                    Xem chi tiết
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </section>
</main>

<div th:replace="~{layout/footer :: nqdFooterFragment}"></div>

<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
