<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: 'Quản lý sản phẩm'">Quản lý sản phẩm</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-product-list.css}">
    <link rel="stylesheet" th:href="@{/css/admin-product-form.css}">

</head>
<body>

<div class="adm-wrapper">

    <!-- NÚT MỞ / THU GỌN SIDEBAR -->
    <div class="adm-menu-toggle"
         onclick="document.querySelector('.adm-sidebar').classList.toggle('active');
                  document.querySelector('.adm-wrapper').classList.toggle('sidebar-active');">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- ========== SIDEBAR CHUNG (GIỐNG DASHBOARD) ========== -->
    <aside class="adm-sidebar">
        <div class="adm-sidebar-inner">
            <!-- Logo -->
            <a th:href="@{/admin/dashboard}" class="adm-logo-row">
                <div class="adm-logo-icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="adm-logo-text">
                    <span class="adm-logo-title">YUD ADMIN</span>
                    <span class="adm-logo-sub">Dashboard</span>
                </div>
            </a>

            <!-- Menu -->
            <nav class="adm-menu">
                <a th:href="@{/admin/dashboard}" class="adm-menu-item">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-gauge-high"></i>
                    </div>
                    <div class="adm-menu-text">Tổng quan</div>
                </a>

                <!-- TRANG HIỆN TẠI: QUẢN LÝ SẢN PHẨM -->
                <a th:href="@{/admin/products}" class="adm-menu-item adm-menu-item--active">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <div class="adm-menu-text">Quản lý sản phẩm</div>
                </a>

                <a th:href="@{/admin/customers}" class="adm-menu-item">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div class="adm-menu-text">Quản lý khách hàng</div>
                </a>

                <a th:href="@{/admin/accounts}" class="adm-menu-item">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <div class="adm-menu-text">Quản lý Admin</div>
                </a>

                <a th:href="@{/admin/orders}" class="adm-menu-item">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                    <div class="adm-menu-text">Quản lý đơn hàng</div>
                </a>

                <a th:href="@{/admin/feedbacks}" class="adm-menu-item">
                    <div class="adm-menu-icon">
                        <i class="fa-regular fa-comment-dots"></i>
                    </div>
                    <div class="adm-menu-text">Quản lý góp ý</div>
                </a>
            </nav>

            <!-- Bottom -->
            <div class="adm-sidebar-bottom">
                <a th:href="@{/}" class="adm-menu-item adm-menu-item--bottom">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <div class="adm-menu-text">Về trang bán hàng</div>
                </a>

                <a th:href="@{/account/logout}" class="adm-menu-item adm-menu-item--bottom">
                    <div class="adm-menu-icon">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <div class="adm-menu-text">Đăng xuất</div>
                </a>
            </div>
        </div>
    </aside>

    <main class="adm-main">

        <header class="adm-main-header">
            <div>
                <h1 th:text="${pageTitle}">Sản phẩm</h1>
                <span class="adm-main-subtitle">Nhập thông tin chi tiết sản phẩm</span>
            </div>
        </header>

        <section class="adm-content adm-content--form">
            <form th:action="@{/admin/products/save}"
                  th:object="${product}"
                  method="post"
                  class="adm-form"
                  enctype="multipart/form-data">   <!-- THÊM DÒNG NÀY -->


                <input type="hidden" th:field="*{id}"/>

                <!-- Danh mục -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Danh mục</label>
                    <select th:field="*{category.id}" class="adm-input">
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select>
                </div>

                <!-- Tên sản phẩm -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Tên sản phẩm</label>
                    <input type="text" th:field="*{name}" class="adm-input" required>
                </div>

                <!-- Slug -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Slug</label>
                    <input type="text" th:field="*{slug}" class="adm-input"
                           placeholder="Có thể để trống, hệ thống tự sinh">
                </div>

                <!-- Giá -->
                <div class="adm-form-row">
                    <div class="adm-form-group">
                        <label class="adm-form-label">Giá bán</label>
                        <input type="number" step="1000" th:field="*{price}" class="adm-input" required>
                    </div>
                    <div class="adm-form-group">
                        <label class="adm-form-label">Giá gốc</label>
                        <input type="number" step="1000" th:field="*{originalPrice}" class="adm-input">
                    </div>
                </div>

                <!-- Trọng lượng / số trứng -->
                <div class="adm-form-row">
                    <div class="adm-form-group">
                        <label class="adm-form-label">Trọng lượng (g)</label>
                        <input type="number" th:field="*{weight}" class="adm-input">
                    </div>
                    <div class="adm-form-group">
                        <label class="adm-form-label">Số trứng</label>
                        <input type="number" th:field="*{eggCount}" class="adm-input">
                    </div>
                </div>

                <!-- Hương vị -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Hương vị</label>
                    <input type="text" th:field="*{flavor}" class="adm-input">
                </div>

                <!-- Ảnh -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Upload ảnh từ máy</label>
                    <input type="file" name="imageFile" class="adm-input">
                    <span class="adm-form-hint">Chấp nhận: .jpg, .png, .jpeg...</span>
                </div>

                <!-- Mô tả -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Mô tả ngắn</label>
                    <textarea th:field="*{shortDescription}" rows="2"
                              class="adm-textarea"></textarea>
                </div>

                <div class="adm-form-group">
                    <label class="adm-form-label">Mô tả chi tiết</label>
                    <textarea th:field="*{description}" rows="4"
                              class="adm-textarea"></textarea>
                </div>

                <!-- Trạng thái -->
                <div class="adm-form-row adm-form-row--checkbox">
                    <label class="adm-checkbox">
                        <input type="checkbox" th:field="*{newProduct}" class="adm-checkbox-input">
                        <span class="adm-checkbox-label">Sản phẩm mới</span>
                    </label>

                    <label class="adm-checkbox">
                        <input type="checkbox" th:field="*{bestSeller}" class="adm-checkbox-input">
                        <span class="adm-checkbox-label">Best seller</span>
                    </label>

                    <label class="adm-checkbox">
                        <input type="checkbox" th:field="*{active}" class="adm-checkbox-input">
                        <span class="adm-checkbox-label">Đang bán</span>
                    </label>
                </div>

                <!-- Tồn kho -->
                <div class="adm-form-group">
                    <label class="adm-form-label">Tồn kho</label>
                    <input type="number" th:field="*{stockQuantity}" class="adm-input">
                </div>

                <div class="adm-form-actions">
                    <button type="submit" class="adm-btn adm-btn-primary adm-btn-lg">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Lưu sản phẩm</span>
                    </button>

                    <a th:href="@{/admin/products}" class="adm-btn adm-btn-secondary">
                        Hủy và quay lại
                    </a>
                </div>

            </form>
        </section>

    </main>
</div>

</body>
</html>
